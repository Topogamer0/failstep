name: Release

# A tag vX.Y.Z builds failstep for Linux x86_64, macOS arm64 and Windows x86_64
# and attaches the archives to the GitHub release of the tag. A release that
# already exists for the tag -- created on the GitHub page, published or draft
# -- is used as it is (title and notes untouched); the workflow creates one,
# with the notes of CHANGELOG.md, only when the tag has none.
#
# Once the release is published with its archives, the failstep formula of the
# Homebrew tap (https://github.com/Topogamer0/homebrew-tap) is moved to the new
# version; see docs/release-integration.md there. A pre-release tag such as
# v1.2.0-rc.1 never updates it, nor does a release marked as pre-release while
# it is one.
#
# A release created on the GitHub page with a new tag starts this workflow when
# it is published, since GitHub creates the tag then. A draft for a vX.Y.Z tag
# pushed beforehand gets the archives but not the formula update, as does a
# vX.Y.Z release marked as pre-release: publishing the draft, or turning the
# pre-release into a full release, runs the workflow again (`release` event,
# type `released`), which then updates the formula.
#
# A published immutable release takes no new assets: with immutable releases
# enabled, push the tag and let the workflow create the release, or create a
# draft for the tag before the builds finish and publish it once the archives
# are attached.
on:
  push:
    tags: ["v*"]
  release:
    types: [released]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: macos-15
            name: macos-arm64
          - os: windows-2025
            name: windows-x86_64
    env:
      ARCHIVE: failstep-${{ github.ref_name }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFAILSTEP_BUILD_EXAMPLES=OFF -DFAILSTEP_BUILD_TESTS=OFF
          -DCMAKE_INSTALL_PREFIX=dist

      - name: Build & install
        run: cmake --build build --config Release --target install

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf "../$ARCHIVE.tar.gz" *
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "$($env:ARCHIVE).zip"

      # Attached by the release job once every platform has built, so that a
      # failed build attaches nothing.
      - name: Keep the archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach the archives to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Compare the tag with the project version
        run: |
          set -euo pipefail
          # project(failstep
          #     VERSION 0.1.2
          version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)"
          # v1.2.0-rc.1 is a pre-release of 1.2.0.
          if [ "v$version" != "${TAG%%-*}" ]; then
            echo "::error::Tag $TAG does not match the version in CMakeLists.txt (${version:-not found})."
            exit 1
          fi

      - name: Download the archives
        uses: actions/download-artifact@v8
        with:
          pattern: failstep-*
          path: dist
          merge-multiple: true

      - name: Attach the archives
        run: |
          set -euo pipefail
          files=(dist/*)
          printf 'Archive: %s\n' "${files[@]}"
          # The releases of the tag, drafts included (the token can see them).
          # A failed request stops the job: it must not be taken for "no release".
          releases_of_tag() {
            gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end'
          }
          existing="$(releases_of_tag)"
          if [ -n "$existing" ]; then
            echo "Release $TAG exists ($(echo "$existing" | paste -sd, -)): attaching the archives to it."
            gh release upload "$TAG" "${files[@]}" --clobber
            exit 0
          fi

          # No release yet: create it, with this version's section of the changelog.
          awk -v heading="## [${TAG#v}]" '
            index($0, "## [") == 1 { if (found) exit; found = (index($0, heading) == 1); next }
            found
          ' CHANGELOG.md > notes.md
          flags=(--verify-tag --title "$TAG")
          if grep -q '[^[:space:]]' notes.md; then
            flags+=(--notes-file notes.md)
          else
            flags+=(--generate-notes)
          fi
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if ! gh release create "$TAG" "${files[@]}" "${flags[@]}"; then
            # Published on the GitHub page in the meantime: attach to that one.
            echo "Could not create release $TAG; attaching the archives to the existing one."
            gh release upload "$TAG" "${files[@]}" --clobber
          fi
          # A draft saved on the GitHub page while gh was creating the release
          # does not stop it: say so rather than leave two releases unnoticed.
          after="$(releases_of_tag)"
          if [ "$(printf '%s\n' "$after" | grep -c .)" -gt 1 ]; then
            echo "::warning::Tag $TAG now has several releases ($(echo "$after" | paste -sd, -)): one was saved on the GitHub page while this job created its own. Keep one and delete the others."
          fi

  # Runs after the archives are attached (tag push), or by itself when a
  # release is published, or a pre-release turned into a full release, on the
  # GitHub page (`release` event).
  check:
    name: Check that the release is published
    needs: release
    if: >-
      ${{ !cancelled() && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') &&
          ((github.event_name == 'push' && needs.release.result == 'success') ||
           github.event_name == 'release') }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Look up the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::$1"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # This endpoint only returns published releases: a draft is a 404.
          status="$(curl -sS --retry 3 -o release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          case "$status" in
            200) ;;
            404) skip "Release $TAG is not published (a draft?): the Homebrew formula is updated when it is." ;;
            *) echo "::error::Looking up release $TAG failed (HTTP $status)."; cat release.json; exit 1 ;;
          esac
          if [ "$(jq -r .prerelease release.json)" = true ]; then
            skip "Release $TAG is a pre-release: the Homebrew formula is updated if it becomes a full release."
          fi
          # The archives the formula downloads.
          missing=""
          for platform in linux-x86_64 macos-arm64; do
            name="failstep-$TAG-$platform.tar.gz"
            state="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state' release.json)"
            [ "$state" = uploaded ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "$GITHUB_EVENT_NAME" = release ]; then
              skip "Release $TAG has no$missing yet: the workflow run of the tag updates the Homebrew formula once it has attached them."
            fi
            echo "::error::Release $TAG lacks$missing."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  homebrew:
    name: Update the Homebrew formula
    needs: check
    # The status function is needed: in a `release` event run, build and
    # release are skipped, and the implicit success() would skip this job too.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out the tap
        uses: actions/checkout@v5
        with:
          repository: Topogamer0/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Update Formula/failstep.rb
        working-directory: homebrew-tap
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/bump-formula.py Formula/failstep.rb "${TAG#v}"

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          FORMULA: failstep
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if git diff --quiet; then
            echo "Formula/$FORMULA.rb is already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "$FORMULA $VERSION"
          # Another release may have pushed to the tap meanwhile: rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          echo "::error::Could not push to Topogamer0/homebrew-tap."
          exit 1
